[package]
name = "smart_road"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/ihamzaihsan/smart-road"
description = "SmartRoad: Traffic Intersection Simulation — a deterministic, light-free traffic simulator"
default-run = "visual_sim"

[features]
default = ["graphics"]
graphics = ["dep:sdl2"]

[dependencies]
rand = "0.8"
nalgebra = "0.32"
sdl2 = { version = "0.35", optional = true }
