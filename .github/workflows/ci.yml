name: Build and runtime checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: Headless / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Run default traffic and drain every accepted vehicle
        run: cargo run --locked --release --no-default-features -- --headless --duration 120 --seed 42 --drain
      - name: Run saturated traffic and drain every accepted vehicle
        run: cargo run --locked --release --no-default-features -- --headless --duration 120 --seed 7 --spawn-interval 0.05 --drain

  system-sdl:
    name: Native SDL / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy
      - name: Install precompiled Windows SDL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'SDL2-devel-2.28.5-VC.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'smartroad-sdl'
          Invoke-WebRequest 'https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-devel-2.28.5-VC.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $libraryDir = Join-Path $destination 'SDL2-2.28.5/lib/x64'
          "SDL2_LIB_DIR=$libraryDir" >> $env:GITHUB_ENV
          $libraryDir >> $env:GITHUB_PATH
      - name: Install Linux SDL and display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev xvfb
      - name: Install macOS SDL
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Exercise Linux X11 rendering
        if: runner.os == 'Linux'
        run: xvfb-run -a env SDL_VIDEODRIVER=x11 cargo run --locked --release -- --demo --duration 3 --no-dialog
      - name: Exercise native Windows or macOS rendering
        if: runner.os != 'Linux'
        run: cargo run --locked --release -- --demo --duration 3 --no-dialog
