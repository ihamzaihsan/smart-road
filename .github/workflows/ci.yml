name: Build and runtime checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: Headless / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Run default traffic and drain every accepted vehicle
        run: cargo run --locked --release --no-default-features -- --headless --duration 120 --seed 42 --drain
      - name: Run saturated traffic and drain every accepted vehicle
        run: cargo run --locked --release --no-default-features -- --headless --duration 120 --seed 7 --spawn-interval 0.05 --drain
